<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Web</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #e8f4ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .calculadora {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px #0002;
      width: 280px;
    }

    h2 {
      text-align: center;
    }

    #pantalla {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      font-size: 24px;
      text-align: right;
      margin-bottom: 15px;
    }

    .botones {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      padding: 15px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 12px;
      background: #cde7ff;
    }

    button:hover {
      background: #ccc;
    }
  </style>
</head>

<body>
  <div class="calculadora">
    <h2>Mi Calculadora web</h2>

    <input type="text" id="pantalla" readonly>

    <div class="botones">
      <button onclick="limpiar()">C</button>
      <button onclick="agregar('(')">(</button>
      <button onclick="agregar(')')">)</button>
      <button onclick="agregar('/')">÷</button>

      <button onclick="agregar('7')">7</button>
      <button onclick="agregar('8')">8</button>
      <button onclick="agregar('9')">9</button>
      <button onclick="agregar('*')">×</button>

      <button onclick="agregar('4')">4</button>
      <button onclick="agregar('5')">5</button>
      <button onclick="agregar('6')">6</button>
      <button onclick="agregar('-')">−</button>

      <button onclick="agregar('1')">1</button>
      <button onclick="agregar('2')">2</button>
      <button onclick="agregar('3')">3</button>
      <button onclick="agregar('+')">+</button>

      <button onclick="agregar('0')">0</button>
      <button onclick="agregar('.')">.</button>
      <button onclick="borrar()">⌫</button>
      <button onclick="calcular()">=</button>
    </div>
  </div>

  <script>
    const pantalla = document.getElementById("pantalla");

    function agregar(valor) {
      pantalla.value += valor;
    }

    function limpiar() {
      pantalla.value = "";
    }

    function borrar() {
      pantalla.value = pantalla.value.slice(0, -1);
    }

    function calcular() {
      try {
        const expresion = pantalla.value;

        if (!/^[0-9+\-*/().\s]+$/.test(expresion)) {
          throw new Error("Expresión no válida");
        }

        const resultado = Function(
          '"use strict"; return (' + expresion + ')'
        )();

        if (!Number.isFinite(resultado)) {
          throw new Error("Resultado no válido");
        }

        pantalla.value = resultado;
      } catch (error) {
        pantalla.value = "Error";
      }
    }
  </script>
</body>
</html>
